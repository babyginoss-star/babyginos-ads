<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby Ginos — Ads Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header span { font-size: 13px; color: #888; }
    .refresh-btn {
      margin-left: auto;
      padding: 6px 14px;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .refresh-btn:hover { background: #005bbf; }

    .filters {
      display: flex;
      gap: 12px;
      padding: 14px 24px;
      flex-wrap: wrap;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
    }
    .filters select, .filters input {
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 13px;
      background: #fafafa;
    }
    .filters label { font-size: 12px; color: #555; display: flex; flex-direction: column; gap: 4px; }

    .summary-bar {
      display: flex;
      gap: 24px;
      padding: 12px 24px;
      font-size: 13px;
      color: #555;
      background: #f5f5f7;
    }
    .summary-bar strong { color: #1d1d1f; }

    .table-wrap { overflow-x: auto; padding: 0 24px 32px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-top: 16px; }
    th {
      background: #f0f0f5;
      text-align: left;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    th:hover { background: #e5e5ea; }
    th .sort-icon { margin-left: 4px; opacity: .5; }
    td {
      padding: 9px 12px;
      font-size: 13px;
      border-top: 1px solid #f0f0f0;
      white-space: nowrap;
    }
    tr:hover td { background: #fafafa; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-TOFU  { background: #ddf4ff; color: #0071e3; }
    .badge-MOFU  { background: #fff3cd; color: #8a5700; }
    .badge-BOFU  { background: #d4edda; color: #1a6e2e; }
    .badge-SIN_DATOS { background: #f0f0f0; color: #888; }

    .cpa-verde   { color: #1a6e2e; font-weight: 600; }
    .cpa-amarillo { color: #8a5700; font-weight: 600; }
    .cpa-rojo    { color: #c0392b; font-weight: 600; }

    .status-ACTIVE   { color: #1a6e2e; }
    .status-PAUSED   { color: #888; }
    .status-other    { color: #c0392b; }

    .loading { text-align: center; padding: 60px; color: #888; }
    .error { text-align: center; padding: 60px; color: #c0392b; }
    .updated-at { font-size: 11px; color: #aaa; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Baby Ginos — Ads Reader</h1>
    <span id="last-updated">Cargando...</span>
  </div>
  <button class="refresh-btn" onclick="loadAds()">Actualizar</button>
</header>

<div class="filters">
  <label>Funnel
    <select id="filter-funnel" onchange="renderTable()">
      <option value="">Todos</option>
      <option value="TOFU">TOFU</option>
      <option value="MOFU">MOFU</option>
      <option value="BOFU">BOFU</option>
      <option value="SIN_DATOS">Sin datos</option>
    </select>
  </label>
  <label>Estado
    <select id="filter-status" onchange="renderTable()">
      <option value="">Todos</option>
      <option value="ACTIVE">Activo</option>
      <option value="PAUSED">Pausado</option>
    </select>
  </label>
  <label>CPA
    <select id="filter-cpa" onchange="renderTable()">
      <option value="">Todos</option>
      <option value="verde">Verde (&lt;=45k)</option>
      <option value="amarillo">Amarillo (45-55k)</option>
      <option value="rojo">Rojo (&gt;55k)</option>
    </select>
  </label>
  <label>Buscar nombre
    <input type="text" id="filter-name" placeholder="nombre del ad..." oninput="renderTable()" />
  </label>
</div>

<div class="summary-bar" id="summary-bar"></div>

<div class="table-wrap">
  <div class="loading" id="loading">Cargando ads...</div>
  <table id="ads-table" style="display:none">
    <thead>
      <tr>
        <th onclick="sortBy('name')">Nombre</th>
        <th onclick="sortBy('status')">Estado</th>
        <th onclick="sortBy('funnel')">Funnel</th>
        <th onclick="sortBy('spend')">Gasto $ARS</th>
        <th onclick="sortBy('impressions')">Impresiones</th>
        <th onclick="sortBy('reach')">Alcance</th>
        <th onclick="sortBy('frequency')">Frecuencia</th>
        <th onclick="sortBy('cpm')">CPM</th>
        <th onclick="sortBy('ctr')">CTR%</th>
        <th onclick="sortBy('cpc')">CPC</th>
        <th onclick="sortBy('purchases')">Compras</th>
        <th onclick="sortBy('cpa')">CPA</th>
        <th onclick="sortBy('roas')">ROAS</th>
        <th onclick="sortBy('updated_at')">Ultima sync</th>
      </tr>
    </thead>
    <tbody id="ads-body"></tbody>
  </table>
</div>

<script>
let allAds = [];
let sortKey = 'spend';
let sortDir = -1;

const API = '/.netlify/functions/get-ads';

async function loadAds() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('ads-table').style.display = 'none';
  document.getElementById('last-updated').textContent = 'Actualizando...';
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    allAds = json.ads || [];
    document.getElementById('last-updated').textContent =
      'Actualizado: ' + new Date().toLocaleString('es-AR');
    renderTable();
  } catch (e) {
    document.getElementById('loading').textContent = 'Error cargando datos: ' + e.message;
    document.getElementById('loading').className = 'error';
  }
}

function cpaClass(cpa) {
  if (!cpa || cpa <= 0) return '';
  if (cpa <= 45000) return 'cpa-verde';
  if (cpa <= 55000) return 'cpa-amarillo';
  return 'cpa-rojo';
}
function cpaLabel(cpa) {
  if (!cpa || cpa <= 0) return '';
  if (cpa <= 45000) return 'verde';
  if (cpa <= 55000) return 'amarillo';
  return 'rojo';
}

function fmt(n, dec) {
  dec = dec || 0;
  if (n == null || n === '') return '-';
  return Number(n).toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtARS(n) {
  if (n == null || n === '') return '-';
  return '$' + fmt(n, 0);
}
function fmtPct(n) {
  if (n == null || n === '') return '-';
  return fmt(n, 2) + '%';
}

function sortBy(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = -1; }
  renderTable();
}

function renderTable() {
  const funnel = document.getElementById('filter-funnel').value;
  const status = document.getElementById('filter-status').value;
  const cpaFilter = document.getElementById('filter-cpa').value;
  const name = document.getElementById('filter-name').value.toLowerCase();

  let rows = allAds.filter(function(ad) {
    if (funnel && ad.funnel !== funnel) return false;
    if (status && ad.status !== status) return false;
    if (cpaFilter && cpaLabel(ad.cpa) !== cpaFilter) return false;
    if (name && !(ad.name || '').toLowerCase().includes(name)) return false;
    return true;
  });

  rows.sort(function(a, b) {
    const av = a[sortKey] != null ? a[sortKey] : '';
    const bv = b[sortKey] != null ? b[sortKey] : '';
    if (av < bv) return -sortDir;
    if (av > bv) return sortDir;
    return 0;
  });

  const totalSpend = rows.reduce(function(s, a) { return s + (a.spend || 0); }, 0);
  const totalPurchases = rows.reduce(function(s, a) { return s + (a.purchases || 0); }, 0);
  const avgFreq = rows.length ? (rows.reduce(function(s, a) { return s + (a.frequency || 0); }, 0) / rows.length) : 0;
  document.getElementById('summary-bar').innerHTML =
    '<span>Ads: <strong>' + rows.length + '</strong></span>' +
    '<span>Gasto total: <strong>' + fmtARS(totalSpend) + '</strong></span>' +
    '<span>Compras: <strong>' + totalPurchases + '</strong></span>' +
    '<span>Freq promedio: <strong>' + fmt(avgFreq, 2) + '</strong></span>';

  const tbody = document.getElementById('ads-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="14" style="text-align:center;padding:40px;color:#888">Sin resultados</td></tr>';
  } else {
    tbody.innerHTML = rows.map(function(ad) {
      const cc = cpaClass(ad.cpa);
      const sc = ad.status === 'ACTIVE' ? 'status-ACTIVE' : ad.status === 'PAUSED' ? 'status-PAUSED' : 'status-other';
      const updatedAt = ad.updated_at ? new Date(ad.updated_at).toLocaleString('es-AR') : '-';
      return '<tr>' +
        '<td title="' + (ad.id || '') + '">' + (ad.name || '-') + '</td>' +
        '<td class="' + sc + '">' + (ad.status || '-') + '</td>' +
        '<td><span class="badge badge-' + (ad.funnel || 'SIN_DATOS') + '">' + (ad.funnel || 'SIN_DATOS') + '</span></td>' +
        '<td>' + fmtARS(ad.spend) + '</td>' +
        '<td>' + fmt(ad.impressions) + '</td>' +
        '<td>' + fmt(ad.reach) + '</td>' +
        '<td>' + fmt(ad.frequency, 2) + '</td>' +
        '<td>' + fmtARS(ad.cpm) + '</td>' +
        '<td>' + fmtPct(ad.ctr) + '</td>' +
        '<td>' + fmtARS(ad.cpc) + '</td>' +
        '<td>' + (ad.purchases != null ? ad.purchases : '-') + '</td>' +
        '<td class="' + cc + '">' + fmtARS(ad.cpa) + '</td>' +
        '<td>' + (ad.roas != null ? fmt(ad.roas, 2) + 'x' : '-') + '</td>' +
        '<td class="updated-at">' + updatedAt + '</td>' +
        '</tr>';
    }).join('');
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('ads-table').style.display = 'table';
}

loadAds();
</script>
</body>
</html>
