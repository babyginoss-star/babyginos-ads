<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Baby Ginos — Ads Reader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header span { font-size: 13px; color: #888; }
    .refresh-btn {
      margin-left: auto;
      padding: 6px 14px;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .refresh-btn:hover { background: #005bbf; }

    .summary-bar {
      display: flex;
      gap: 24px;
      padding: 12px 24px;
      font-size: 13px;
      color: #555;
      background: #f5f5f7;
    }
    .summary-bar strong { color: #1d1d1f; }

    .table-wrap { overflow-x: auto; padding: 0 24px 32px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-top: 16px; }

    thead tr.header-labels th {
      background: #f0f0f5;
      text-align: left;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    thead tr.header-labels th:hover { background: #e5e5ea; }
    thead tr.header-labels th.no-sort { cursor: default; }
    thead tr.header-labels th.no-sort:hover { background: #f0f0f5; }
    th .sort-icon { margin-left: 4px; opacity: .5; }

    thead tr.header-filters th {
      background: #fafafa;
      padding: 6px 8px;
      border-bottom: 1px solid #e0e0e0;
    }
    thead tr.header-filters input,
    thead tr.header-filters select {
      width: 100%;
      padding: 4px 6px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 12px;
      background: #fff;
      color: #333;
    }
    thead tr.header-filters input::placeholder { color: #bbb; }

    td {
      padding: 8px 12px;
      font-size: 13px;
      border-top: 1px solid #f0f0f0;
      white-space: nowrap;
      vertical-align: middle;
    }
    tr:hover td { background: #fafafa; }

    /* Thumbnail */
    .ad-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }
    .thumb-placeholder {
      width: 48px;
      height: 48px;
      border-radius: 6px;
      background: #e5e5ea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* Estado badges */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-tractor     { background: #d4edda; color: #1a6e2e; }
    .badge-prometedor  { background: #fff3cd; color: #7a4f00; }
    .badge-atencion    { background: #ffe0b2; color: #8d3200; }
    .badge-pausar      { background: #b91c1c; color: #fff; }
    .badge-cerrador    { background: #d0e4ff; color: #0040a0; }
    .badge-no_suma     { background: #fde8e8; color: #b91c1c; }
    .badge-sin_evaluar { background: #f0f0f0; color: #777; }

    .cpa-verde    { color: #1a6e2e; font-weight: 600; }
    .cpa-amarillo { color: #8a5700; font-weight: 600; }
    .cpa-naranja  { color: #8d3200; font-weight: 600; }
    .cpa-rojo     { color: #c0392b; font-weight: 600; }

    .loading { text-align: center; padding: 60px; color: #888; }
    .error   { text-align: center; padding: 60px; color: #c0392b; }
    .dim     { color: #aaa; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>👶 Baby Ginos — Ads Reader</h1>
    <span id="last-updated">Cargando…</span>
  </div>
  <button class="refresh-btn" onclick="loadAds()">↻ Actualizar</button>
</header>

<div class="summary-bar" id="summary-bar"></div>

<div class="table-wrap">
  <div class="loading" id="loading">Cargando ads…</div>
  <table id="ads-table" style="display:none">
    <thead>
      <tr class="header-labels">
        <th class="no-sort">Creativo</th>
        <th onclick="sortBy('name')">Nombre <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('campaign')">Campaña <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('status')">Estado actual <span class="sort-icon">↕</span></th>
        <th>Estado hace 7 días</th>
        <th onclick="sortBy('spend')">Gasto $ARS <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('cpm')">CPM <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('frequency')">Frecuencia <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('cpa')">CPA <span class="sort-icon">↕</span></th>
        <th onclick="sortBy('results')">Compras <span class="sort-icon">↕</span></th>
      </tr>
      <tr class="header-filters">
        <th></th>
        <th><input type="text" id="f-name" placeholder="buscar…" oninput="renderTable()" /></th>
        <th><select id="f-campaign" onchange="renderTable()"><option value="">Todas</option></select></th>
        <th>
          <select id="f-status" onchange="renderTable()">
            <option value="">Todos</option>
            <option value="tractor">🚜 Tractor</option>
            <option value="prometedor">⭐ Prometedor</option>
            <option value="atencion">⚠️ Atención</option>
            <option value="pausar">🛑 Pausar</option>
            <option value="cerrador">🔒 Cerrador</option>
            <option value="no_suma">❌ No suma</option>
            <option value="sin_evaluar">⬜ Sin evaluar</option>
          </select>
        </th>
        <th>
          <select id="f-prev-status" onchange="renderTable()">
            <option value="">Todos</option>
            <option value="tractor">🚜 Tractor</option>
            <option value="prometedor">⭐ Prometedor</option>
            <option value="atencion">⚠️ Atención</option>
            <option value="pausar">🛑 Pausar</option>
            <option value="cerrador">🔒 Cerrador</option>
            <option value="no_suma">❌ No suma</option>
            <option value="sin_evaluar">⬜ Sin evaluar</option>
          </select>
        </th>
        <th></th><th></th><th></th>
        <th>
          <select id="f-cpa" onchange="renderTable()">
            <option value="">Todos</option>
            <option value="verde">Verde ≤$45k</option>
            <option value="amarillo">Amarillo $45-55k</option>
            <option value="naranja">Naranja $56-70k</option>
            <option value="rojo">Rojo &gt;$70k</option>
          </select>
        </th>
        <th></th>
      </tr>
    </thead>
    <tbody id="ads-body"></tbody>
  </table>
</div>

<script>
let allAds = [];
let sortKey = 'spend';
let sortDir = -1;

const API = '/.netlify/functions/get-ads';

const STATUS_LABELS = {
  tractor:     '🚜 Tractor',
  prometedor:  '⭐ Prometedor',
  atencion:    '⚠️ Atención',
  pausar:      '🛑 Pausar',
  cerrador:    '🔒 Cerrador',
  no_suma:     '❌ No suma',
  sin_evaluar: '⬜ Sin evaluar',
};

async function loadAds() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('ads-table').style.display = 'none';
  document.getElementById('last-updated').textContent = 'Actualizando…';
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    allAds = json.ads || [];

    const campaigns = [...new Set(allAds.map(a => a.campaign).filter(Boolean))].sort();
    const sel = document.getElementById('f-campaign');
    sel.innerHTML = '<option value="">Todas</option>' +
      campaigns.map(c => '<option value="' + c + '">' + c + '</option>').join('');

    document.getElementById('last-updated').textContent =
      'Actualizado: ' + new Date().toLocaleString('es-AR');
    renderTable();
  } catch (e) {
    const el = document.getElementById('loading');
    el.textContent = '⚠️ Error: ' + e.message;
    el.className = 'error';
  }
}

function cpaColor(cpa) {
  if (!cpa || cpa <= 0) return '';
  if (cpa <= 45000) return 'cpa-verde';
  if (cpa <= 55000) return 'cpa-amarillo';
  if (cpa <= 70000) return 'cpa-naranja';
  return 'cpa-rojo';
}
function cpaLabel(cpa) {
  if (!cpa || cpa <= 0) return '';
  if (cpa <= 45000) return 'verde';
  if (cpa <= 55000) return 'amarillo';
  if (cpa <= 70000) return 'naranja';
  return 'rojo';
}
function fmt(n, dec = 0) {
  if (n == null || n === '') return '—';
  return Number(n).toLocaleString('es-AR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtARS(n) {
  if (n == null || n === '') return '—';
  return '$' + fmt(n, 0);
}
function sortBy(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = -1; }
  renderTable();
}
function statusBadge(s) {
  if (!s) return '<span class="dim">—</span>';
  return '<span class="badge badge-' + s + '">' + (STATUS_LABELS[s] || s) + '</span>';
}
function thumbCell(url) {
  if (url) return '<img class="ad-thumb" src="' + url + '" loading="lazy" onerror="this.parentNode.innerHTML=\'<div class=thumb-placeholder>🖼️</div>\'"/>';
  return '<div class="thumb-placeholder">🖼️</div>';
}

function renderTable() {
  const fName       = document.getElementById('f-name').value.toLowerCase();
  const fCampaign   = document.getElementById('f-campaign').value;
  const fStatus     = document.getElementById('f-status').value;
  const fPrevStatus = document.getElementById('f-prev-status').value;
  const fCpa        = document.getElementById('f-cpa').value;

  let rows = allAds.filter(ad => {
    if (fName       && !(ad.name || '').toLowerCase().includes(fName)) return false;
    if (fCampaign   && ad.campaign !== fCampaign) return false;
    if (fStatus     && ad.status !== fStatus) return false;
    if (fPrevStatus && ad.prev_status !== fPrevStatus) return false;
    if (fCpa        && cpaLabel(ad.cpa) !== fCpa) return false;
    return true;
  });

  rows.sort((a, b) => {
    const av = a[sortKey] ?? '';
    const bv = b[sortKey] ?? '';
    if (av < bv) return -sortDir;
    if (av > bv) return sortDir;
    return 0;
  });

  const totalSpend = rows.reduce((s, a) => s + (a.spend || 0), 0);
  const totalBuys  = rows.reduce((s, a) => s + (a.results || 0), 0);
  document.getElementById('summary-bar').innerHTML =
    '<span>Ads: <strong>' + rows.length + '</strong></span>' +
    '<span>Gasto total: <strong>' + fmtARS(totalSpend) + '</strong></span>' +
    '<span>Compras totales: <strong>' + totalBuys + '</strong></span>';

  const tbody = document.getElementById('ads-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:#888">Sin resultados</td></tr>';
  } else {
    tbody.innerHTML = rows.map(ad => {
      const cc = cpaColor(ad.cpa);
      return '<tr>' +
        '<td>' + thumbCell(ad.thumbnail_url) + '</td>' +
        '<td title="' + (ad.ad_id || '') + '">' + (ad.name || '—') + '</td>' +
        '<td>' + (ad.campaign || '—') + '</td>' +
        '<td>' + statusBadge(ad.status) + '</td>' +
        '<td>' + statusBadge(ad.prev_status) + '</td>' +
        '<td>' + fmtARS(ad.spend) + '</td>' +
        '<td>' + fmtARS(ad.cpm) + '</td>' +
        '<td>' + fmt(ad.frequency, 2) + '</td>' +
        '<td class="' + cc + '">' + fmtARS(ad.cpa) + '</td>' +
        '<td>' + (ad.results ?? '—') + '</td>' +
        '</tr>';
    }).join('');
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('ads-table').style.display = 'table';
}

loadAds();
</script>
</body>
</html>
